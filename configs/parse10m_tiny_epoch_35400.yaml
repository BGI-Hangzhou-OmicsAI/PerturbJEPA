# Epoch-loader control: numerical recipe and step schedule match Tiny visit.
data:
  dataset_root: ../data/parse10m/v1
  protocol: drug_cell_type
  fold: null
  cells_per_group: 256
  seed: 42
model:
  hidden_size: 128
  encoder_layers: 2
  encoder_attention_heads: 4
  encoder_intermediate_size: 512
  predictor_type: token_adaln
  predictor_layers: 1
  predictor_attention_heads: 4
  predictor_intermediate_size: 512
  predictor_layer_scale_init: 0.1
  action_embedding_size: 128
  attention_dropout: 0.0
  hidden_dropout: 0.0
  rms_norm_eps: 1.0e-06
  initializer_range: 0.02
  gene_pooling_normalization: l2
  encoder_layer_scale_init: 0.1
  normalize_action_embedding: true
  bulk_effect_intermediate_size: 64
  bulk_effect_input_scale: 16.0
  adaln_weight_init_std: 0.0
  adaln_gate_init: 0.0
  action_input_scale: 0.0
  action_encoder_type: condition_id
loss:
  distribution_loss: energy
  distribution_loss_weight: 1.0
  distribution_normalize_by_sqrt_dim: true
  geomloss_p: 2
  geomloss_blur: 0.05
  geomloss_reach: null
  geomloss_scaling: 0.9
  geomloss_debias: true
  geomloss_backend: tensorized
  sigreg_weight: 1.0
  sigreg_num_slices: 256
  sigreg_n_points: 17
  sigreg_t_max: 3.0
  sigreg_scope: both
  sigreg_sample_mode: batch_per_cell
  sigreg_normalize_by_num_samples: true
  bulk_effect_weight: 0.25
  bulk_effect_sigreg_weight: 1.0
  bulk_effect_scale: 0.2
  action_rank_weight: 0.001
  action_rank_num_negatives: 8
  action_rank_temperature: 0.01
  action_rank_cells: 32
training:
  output_dir: outputs/parse10m_id_tiny_epoch_35400
  run_name: parse10m_id_tiny_epoch_35400
  seed: 42
  data_seed: 42
  per_device_train_batch_size: 15
  per_device_eval_batch_size: 15
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-05
  optim: adamw_torch
  weight_decay: 0.001
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  bf16: true
  tf32: true
  logging_strategy: steps
  logging_steps: 10
  eval_strategy: steps
  save_strategy: steps
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_retrieval_mrr
  greater_is_better: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 2
  ddp_find_unused_parameters: false
  accelerator_config:
    dispatch_batches: false
    split_batches: false
  disable_tqdm: true
  max_steps: 35400
  eval_steps: 354
  save_steps: 354
swanlab:
  enabled: false
  project: perturbjepa-parse10m
  mode: offline
retrieval:
  enabled: true
  candidate_scope: all_actions
  cells_per_group: 256
  seed: 20260930
  candidate_batch_size: 32
  bootstrap_replicates: 4000
